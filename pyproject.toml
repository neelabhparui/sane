[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sane-nav"
version = "0.4.4"
description = "Token-efficient progressive-disclosure semantic code navigation engine and MCP server for AI coding agents"
readme = "README.md"
authors = [
    { name = "neelabhparui" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "mcp",
    "model-context-protocol",
    "code-navigation",
    "ai-agents",
    "token-efficiency",
    "ast",
    "progressive-disclosure",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "watchfiles>=0.21.0",
    "pathspec>=0.12.0",
    "typer>=0.12.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-language-pack>=0.2.0",
    "tomli>=2.0.0;python_version<'3.11'",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
semantic = [
    "sqlite-vec",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pylint>=3.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
sane = "sane_nav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sane_nav*"]

[tool.setuptools.package-data]
"sane_nav.parsing.treesitter" = ["queries/*.scm", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.pylint.main]
py-version = "3.10"
ignore-paths = ["tests/fixtures"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "duplicate-code",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "too-few-public-methods",
    "too-many-return-statements",
    "broad-exception-caught",
    "logging-fstring-interpolation",
    "redefined-outer-name",
    "protected-access",
    "invalid-name",
    "import-outside-toplevel",
    "wrong-import-position",
]

[tool.pylint.format]
max-line-length = 120
